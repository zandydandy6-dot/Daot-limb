name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack src.zip
        run: |
          unzip -q -o src.zip -d tmp_unzip
          if [ -d tmp_unzip/src ]; then
            cp -r tmp_unzip/src ./
          else
            mkdir -p src
            cp -r tmp_unzip/* src/
          fi
          find src -maxdepth 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: daot-limbs-jar
          path: build/libs/*.jar
